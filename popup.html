<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <script src="xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon16.png" class="brand-logo" alt="Logo">
        <span class="brand-text">LinkedIn Extractor</span>
      </div>
      <a href="https://buymeacoffee.com/ashirwad05" target="_blank" rel="noopener noreferrer" class="support-btn" title="Support the creator">
        <img src="icons/coffee.png" alt="Buy Me a Coffee">
      </a>
    </header>

    <div class="tag-bar">
      <span class="tag-label">Tag:</span>
      <span id="savedCompanyDisplay" class="tag-name hidden">Not set</span>
      <input type="text" id="companyName" class="tag-input" placeholder="Enter company name...">
      <button id="editCompanyBtn" class="tool-btn inline-edit-btn hidden" title="Edit tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button id="startBtn" class="btn btn-primary inline-start-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Start
      </button>
    </div>

    <button id="extractCompanyBtn" class="btn btn-secondary company-extract-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      Extract Same-Company Colleagues
    </button>

    <div id="status" class="status"></div>

    <div id="results" class="results hidden">
      <div class="results-header">
        <div class="results-title">
          <div class="results-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span>Extracted Profiles</span>
          <span id="profileCount" class="count-badge">0</span>
        </div>
        <div class="results-tools">
          <button id="searchToggleBtn" class="tool-btn" title="Search profiles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button id="filterBtn" class="tool-btn" title="Filter profiles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
          </button>
        </div>
      </div>

      <div id="searchBar" class="search-bar hidden">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or company...">
        </div>
      </div>

      <div class="table-container">
        <table id="resultsTable">
          <thead>
            <tr>
              <th class="col-num">#</th>
              <th>Name</th>
              <th>Company</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="results-footer">
        <button id="downloadCsvBtn" class="btn btn-download" disabled>
          <img src="icons/csv.png" class="export-icon" alt="CSV">
          Download CSV
        </button>
        <button id="downloadExcelBtn" class="btn btn-download" disabled>
          <img src="icons/excel.png" class="export-icon" alt="Excel">
          Download Excel
        </button>
      </div>

      <button id="clearBtn" class="btn btn-danger">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear All Results
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
  <script src="popup-company.js"></script>
</body>
</html>
